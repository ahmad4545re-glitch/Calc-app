name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev

 - name: Install Buildozer and Cython
  run: |
    pip install --upgrade pip
    pip install cython==0.29.33
    pip install --upgrade setuptools==65.5.0
    pip install git+https://github.com/kivy/buildozer
    

    - name: Build with Buildozer
      run: |
        rm -rf .buildozer
        export BUILDOZER_ANDROID_MIN_API=21
        sed -i 's/android.min_api = 24/android.min_api = 21/g' buildozer.spec
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
        
