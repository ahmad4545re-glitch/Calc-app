name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install --upgrade cython buildozer

      - name: Build with Buildozer
      run: |
        # Purana cache aur .buildozer folder saaf karein taake nayi configuration apply ho
        rm -rf .buildozer
        
        # Python script ke zariye spec file mein min_api ko 21 par set karein
        python3 -c "
        with open('buildozer.spec', 'r') as f:
            lines = f.readlines()
        with open('buildozer.spec', 'w') as f:
            for line in lines:
                if 'android.min_api' in line:
                    f.write('android.min_api = 21\n')
                else:
                    f.write(line)
        "
        
        buildozer -v android debug
        
        
        

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
        
